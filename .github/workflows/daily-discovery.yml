name: Daily job discovery

on:
  schedule:
    - cron: '7 8 * * *'
    - cron: '7 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Berlin execution hour
        id: time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ=Europe/Berlin date +%H)
            if [ "$HOUR" = "10" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/setup-node@v4
        if: steps.time_gate.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Search official sources and web results
        if: steps.time_gate.outputs.run == 'true'
        id: discover
        run: node scripts/daily-discover.mjs

      - name: Commit updated discovery data
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discoveries.json monitor-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily job discovery $(date -u +%F)"
            git push
          fi

      - name: Notify about new candidates
        if: steps.time_gate.outputs.run == 'true' && steps.discover.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "发现 ${{ steps.discover.outputs.new_count }} 条新的秋招岗位线索" --body-file new-discoveries.md
